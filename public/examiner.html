<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Examiner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
#ai-examiner{--bg:#f5f6fa;--card:#fff;--ink:#12141c;--mute:#6a7183;--line:#e5e8f0;--acc:#4f46e5;--ok:#15a05a;--mid:#d98a06;--bad:#e03a3a;--soft:#f0f1f7;
font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);max-width:980px;margin:0 auto;padding:24px 16px 60px;line-height:1.55}
@media(prefers-color-scheme:dark){#ai-examiner{--bg:#0c0e15;--card:#151822;--ink:#eef0f7;--mute:#8c94a8;--line:#252a3a;--soft:#1c2030;--acc:#8b85ff}}
#ai-examiner *{box-sizing:border-box}
#ai-examiner h2,#ai-examiner h3,#ai-examiner h4,#ai-examiner p{margin:0}
.tabs{display:inline-flex;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:22px}
.tabs button{border:0;background:none;color:var(--mute);font:600 14px Manrope,sans-serif;padding:10px 22px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.12)}
.panel{display:none}.panel.on{display:block}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* chat */
.chat{display:flex;flex-direction:column;height:min(70vh,680px);background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
#msgs{flex:1;overflow-y:auto;padding:24px 22px;display:flex;flex-direction:column;gap:20px}
.empty{margin:auto;text-align:center;color:var(--mute)}.empty h3{color:var(--ink);font-size:20px;margin-bottom:4px}
.m{max-width:88%;font-size:15.5px}
.m.u{align-self:flex-end;background:var(--soft);padding:10px 16px;border-radius:18px 18px 4px 18px;white-space:pre-wrap}
.m.a p{margin:0 0 10px}.m.a ul{margin:0 0 10px;padding-left:20px}.m.a li{margin:3px 0}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
.bar{display:flex;gap:10px;align-items:flex-end;padding:12px;border-top:1px solid var(--line)}
.bar textarea{flex:1;resize:none;border:0;background:var(--soft);color:var(--ink);font:500 15px Manrope,sans-serif;padding:12px 16px;border-radius:14px;max-height:140px}
.go{border:0;background:var(--acc);color:#fff;width:44px;height:44px;border-radius:12px;font-size:18px;cursor:pointer;flex:none}

/* paper */
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.drop{background:var(--card);border:1.5px dashed var(--line);border-radius:18px;padding:16px;transition:.15s}
.drop.on{border-color:var(--acc);background:var(--soft)}
.drop label{display:block;cursor:pointer;text-align:center;padding:18px 6px}
.drop b{display:block;font-size:15px}.drop small{color:var(--mute)}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fc{background:var(--soft);border-radius:8px;padding:4px 6px 4px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center;max-width:100%}
.fc button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:15px;line-height:1}
.drop textarea{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:13px Manrope,sans-serif;resize:vertical;min-height:54px}
.run{margin-top:16px;width:100%;border:0;background:linear-gradient(120deg,#4f46e5,#9333ea);color:#fff;font:700 16px Manrope,sans-serif;padding:16px;border-radius:14px;cursor:pointer}
.run:disabled{opacity:.45;cursor:not-allowed}
.prog{display:none;margin-top:16px}.prog.on{display:block}
.prog .t{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:8px}
.prog .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#c026d3);transition:width .4s}
.err{margin-top:14px;padding:12px 16px;border-radius:12px;background:rgba(224,58,58,.12);color:var(--bad);display:none;font-size:14px}

#res{margin-top:28px}
.hero{--c:var(--ok);position:relative;overflow:hidden;display:flex;gap:30px;align-items:center;flex-wrap:wrap;padding:34px;border-radius:26px;color:#fff;
background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--c) 70%,#000) 0%,#10121c 70%)}
.hero.mid{--c:var(--mid)}.hero.bad{--c:var(--bad)}
.ringw{position:relative;width:170px;height:170px;flex:none}
.ring{width:100%;height:100%}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.trk{stroke:rgba(255,255,255,.14)}.arc{stroke:#fff;filter:drop-shadow(0 0 8px var(--c));transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.pc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.pc b{font-size:42px;font-weight:800;line-height:1}.pc span{font-size:13px;opacity:.75}
.hi{flex:1;min-width:240px}
.hi .mk1{font-size:15px;opacity:.8}.hi .big{font-size:54px;font-weight:800;line-height:1.1;letter-spacing:-1px}.hi .big small{font-size:26px;opacity:.6;font-weight:600}
.hi .vd{display:inline-block;margin:8px 0 12px;padding:5px 14px;border-radius:99px;background:rgba(255,255,255,.16);font-weight:700;font-size:14px}
.hi p{opacity:.88;font-size:14.5px;max-width:56ch}
.st{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.st span{background:rgba(255,255,255,.12);padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600}

.sec{margin:34px 0 14px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.sec em{font-style:normal;font-size:13px;font-weight:700;background:var(--soft);color:var(--mute);padding:2px 10px;border-radius:99px}
.mk{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:16px;padding:16px 20px;margin-bottom:12px}
.mkh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mk p{font-size:14.5px;margin-top:6px}.lb{display:inline-block;font-weight:700;font-size:12.5px;color:var(--bad);margin-right:8px}.lb.ok{color:var(--ok)}
.chip{font-weight:800;font-size:13px;padding:3px 11px;border-radius:99px}
.chip.ok{background:rgba(21,160,90,.14);color:var(--ok)}.chip.mid{background:rgba(217,138,6,.15);color:var(--mid)}.chip.bad{background:rgba(224,58,58,.13);color:var(--bad)}
.good{background:rgba(21,160,90,.1);color:var(--ok);padding:16px 20px;border-radius:16px;font-weight:600}
.qc{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden}
.qh{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.qn{font-weight:800}.qt{flex:1;color:var(--mute);font-size:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr)}
.g3>div{padding:16px 20px;font-size:14px;border-right:1px solid var(--line)}.g3>div:last-child{border:0;background:rgba(21,160,90,.06)}
.g3 h4{font-size:12.5px;color:var(--mute);margin-bottom:8px}
.g3 p{margin-bottom:6px}.pts{list-style:none;margin:0;padding:0}.pts li{display:flex;gap:8px;margin-bottom:7px}
.pts i{font-style:normal;font-weight:800;flex:none}.pts .ok i{color:var(--ok)}.pts .bad i{color:var(--bad)}
.mute{color:var(--mute)}
details{margin-top:24px}summary{cursor:pointer;color:var(--mute);font-weight:600;font-size:14px}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font:12.5px/1.5 ui-monospace,monospace;max-height:340px;overflow:auto}
@media(max-width:760px){.zones,.g3{grid-template-columns:1fr}.g3>div{border-right:0;border-bottom:1px solid var(--line)}.hero{padding:24px}}
@media(prefers-reduced-motion:reduce){.arc{transition:none}}
</style>
</head>
<body>
<section id="ai-examiner">
  <div class="tabs" role="tablist">
    <button class="on" data-t="chat" role="tab">Chatbot</button>
    <button data-t="paper" role="tab">Paper Correction</button>
  </div>

  <!-- CHATBOT -->
  <div class="panel on" id="p-chat">
    <div class="chat">
      <div id="msgs"><div class="empty" id="emp"><h3>Ask anything</h3><p>Questions, explanations, revision help.</p></div></div>
      <div class="bar">
        <textarea id="inp" rows="1" placeholder="Type your message"></textarea>
        <button class="go" id="send" aria-label="Send">&#10148;</button>
      </div>
    </div>
  </div>

  <!-- PAPER CORRECTION -->
  <div class="panel" id="p-paper">
    <div class="zones">
      <div class="drop" data-k="a"><label><b>Answers, part 1</b><small>PDF or photos. Drop or click</small><input type="file" hidden multiple accept=".pdf,image/*"></label><div class="fl"></div></div>
      <div class="drop" data-k="b"><label><b>Answers, part 2</b><small>Optional. PDF or photos</small><input type="file" hidden multiple accept=".pdf,image/*"></label><div class="fl"></div></div>
      <div class="drop" data-k="m"><label><b>Mark scheme</b><small>PDF or photos. Drop or click</small><input type="file" hidden multiple accept=".pdf,image/*"></label><div class="fl"></div>
        <textarea id="msText" placeholder="Or paste the mark scheme text here"></textarea></div>
    </div>
    <button class="run" id="run" disabled>Check paper</button>
    <div class="prog" id="prog"><span id="pt" class="mute"></span><div class="t"><i id="pb"></i></div></div>
    <div class="err" id="err"></div>
    <div id="res"></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ================= CONFIG: edit this block ================= */
const CONFIG = {
  PROVIDER: "openai",                 // "openai" or "anthropic"
  API_KEY: "key_ps5gnQ9rlp4xSCl6",    // chatgpt secret value
  MODELS: {
    openai:    { chat: "gpt-4o-mini",      ocr: "gpt-4o",            grade: "gpt-4o" },
    anthropic: { chat: "claude-haiku-5-5", ocr: "claude-sonnet-5-5", grade: "claude-opus-5-5" }
  }
};
/* =========================================================== */
const $ = s => document.querySelector(s), M = () => CONFIG.MODELS[CONFIG.PROVIDER];
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ---------- tabs ---------- */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button,.panel").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $("#p-" + b.dataset.t).classList.add("on");
});

/* ---------- text cleaning: removes $ signs, LaTeX and markdown symbols ---------- */
const sup = {2: "²", 3: "³"};
function clean(t) {
  t = String(t ?? "");
  t = t.replace(/\\\[([\s\S]*?)\\\]/g, "$1").replace(/\\\(([\s\S]*?)\\\)/g, "$1")
       .replace(/\$\$([\s\S]*?)\$\$/g, "$1").replace(/\$(?!\s)([^$\n]*?\S)\$/g, "$1");
  const fr = s => s.length > 1 && /[^\w.]/.test(s) ? "(" + s + ")" : s;
  t = t.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, (_, a, b) => fr(a) + "/" + fr(b))
       .replace(/\\sqrt\{([^{}]*)\}/g, "√($1)").replace(/\\(?:text|mathrm|mathbf|textbf)\{([^{}]*)\}/g, "$1")
       .replace(/\\times/g, "×").replace(/\\cdot/g, "·").replace(/\\div/g, "÷").replace(/\\pm/g, "±")
       .replace(/\\(?:leq?|leqslant)/g, "≤").replace(/\\(?:geq?|geqslant)/g, "≥").replace(/\\neq/g, "≠")
       .replace(/\\approx/g, "≈").replace(/\\pi/g, "π").replace(/\\theta/g, "θ").replace(/\\degree|\^\{?\\circ\}?/g, "°")
       .replace(/\\(?:left|right|,|;|!|quad)/g, "").replace(/\^\{?([23])\}?/g, (_, d) => sup[d])
       .replace(/\^\{([^{}]*)\}/g, "^$1").replace(/\\([a-zA-Z]+)/g, "$1");
  return t.replace(/^\s{0,3}#{1,6}\s*/gm, "").replace(/^\s*([-*_]){3,}\s*$/gm, "").replace(/`+/g, "").replace(/\\\$/g, "$");
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const inl = t => esc(clean(t)).replace(/\*+/g, "").trim();
function fmt(t) {
  const out = []; let list = [];
  const flush = () => { if (list.length) out.push("<ul>" + list.map(x => "<li>" + x + "</li>").join("") + "</ul>"); list = []; };
  for (const raw of esc(clean(t)).split("\n")) {
    const l = raw.trim(), li = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
    if (li) { list.push(li[1]); continue; }
    flush(); if (l) out.push("<p>" + l + "</p>");
  }
  flush();
  return out.join("").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*+/g, "");
}

/* ---------- provider-agnostic LLM call (streaming supported) ---------- */
async function llm({system, messages, model, stream, onToken, json, signal}) {
  const A = CONFIG.PROVIDER === "anthropic";
  if (!CONFIG.API_KEY || CONFIG.API_KEY.startsWith("PASTE")) throw new Error("Add your API key to the CONFIG block at the top of the script.");
  const conv = messages.map(m => ({role: m.role, content: typeof m.content === "string" ? m.content :
    m.content.map(p => p.image
      ? (A ? {type: "image", source: {type: "base64", media_type: "image/jpeg", data: p.image}}
           : {type: "image_url", image_url: {url: "data:image/jpeg;base64," + p.image, detail: "high"}})
      : {type: "text", text: p.text})}));
  const body = A ? {model, max_tokens: 8000, system, messages: conv, stream: !!stream}
    : {model, messages: [{role: "system", content: system}, ...conv], stream: !!stream, temperature: json ? 0 : 0.5,
       ...(json ? {response_format: {type: "json_object"}} : {})};
  const useDirectOpenAi = !A && CONFIG.API_KEY.startsWith("sk-");
  const url = A ? "https://api.anthropic.com/v1/messages" : (useDirectOpenAi ? "https://api.openai.com/v1/chat/completions" : "/api/llm");
  const headers = A ? {"x-api-key": CONFIG.API_KEY, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true", "content-type": "application/json"}
                    : {Authorization: "Bearer " + CONFIG.API_KEY, "x-site-key": CONFIG.API_KEY, "content-type": "application/json"};
  let res;
  for (let i = 0; i < 3; i++) {
    res = await fetch(url, {method: "POST", headers, body: JSON.stringify(body), signal});
    if (res.ok || ![429, 500, 502, 503, 529].includes(res.status)) break;
    await new Promise(r => setTimeout(r, 1500 * (i + 1)));
  }
  if (!res.ok) { let m = await res.text(); try { m = JSON.parse(m).error.message } catch {} throw new Error(m.slice(0, 300)); }
  if (!stream) { const j = await res.json(); return A ? j.content.map(c => c.text || "").join("") : j.choices[0].message.content; }
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "", full = "";
  for (;;) {
    const {done, value} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream: true}); const ls = buf.split("\n"); buf = ls.pop();
    for (const l of ls) {
      if (!l.startsWith("data:")) continue; const d = l.slice(5).trim(); if (d === "[DONE]") continue;
      try { const j = JSON.parse(d); const t = j.choices?.[0]?.delta?.content || (j.type === "content_block_delta" ? j.delta?.text : "") || "";
            if (t) { full += t; onToken(full); } } catch {}
    }
  }
  return full;
}

/* ---------- CHATBOT ---------- */
const CHAT_SYS = "You are a friendly, sharp AI tutor and examiner. Answer quickly, clearly and accurately. Write plain text only: never use LaTeX, dollar signs, markdown headings, tables or code fences unless the user asks for code. Write maths in plain text (x^2, 3/4, sqrt(9)). Keep paragraphs short and use simple '- ' lists only when they help.";
const hist = []; let ctl = null, busy = false;
const inp = $("#inp"), msgs = $("#msgs");
inp.oninput = () => { inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 140) + "px"; };
inp.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
$("#send").onclick = () => busy ? ctl.abort() : send();
async function send() {
  const text = inp.value.trim(); if (!text || busy) return;
  $("#emp")?.remove(); inp.value = ""; inp.style.height = "auto";
  msgs.insertAdjacentHTML("beforeend", `<div class="m u">${esc(text)}</div><div class="m a"><span class="dots"><i></i><i></i><i></i></span></div>`);
  const box = msgs.lastElementChild; msgs.scrollTop = msgs.scrollHeight;
  hist.push({role: "user", content: text}); busy = true; ctl = new AbortController(); $("#send").innerHTML = "&#9632;";
  let acc = "", raf = 0;
  try {
    acc = await llm({system: CHAT_SYS, model: M().chat, stream: true, signal: ctl.signal, messages: hist.slice(-20),
      onToken: t => { acc = t; if (!raf) raf = requestAnimationFrame(() => { raf = 0; box.innerHTML = fmt(acc); msgs.scrollTop = msgs.scrollHeight; }); }});
    box.innerHTML = fmt(acc); hist.push({role: "assistant", content: acc});
  } catch (e) {
    if (e.name === "AbortError") { box.innerHTML = fmt(acc || "Stopped."); if (acc) hist.push({role: "assistant", content: acc}); }
    else { box.innerHTML = `<p style="color:var(--bad)">${esc(e.message)}</p>`; hist.pop(); }
  }
  busy = false; $("#send").innerHTML = "&#10148;"; msgs.scrollTop = msgs.scrollHeight;
}

/* ---------- PAPER CORRECTION: uploads ---------- */
const files = {a: [], b: [], m: []};
const chk = () => $("#run").disabled = !(files.a.length + files.b.length && (files.m.length || $("#msText").value.trim()));
$("#msText").oninput = chk;
document.querySelectorAll(".drop").forEach(z => {
  const k = z.dataset.k, fi = z.querySelector("input");
  const add = fl => { files[k].push(...[...fl].filter(f => /pdf|image/.test(f.type) || /\.pdf$/i.test(f.name))); draw(z, k); chk(); };
  fi.onchange = () => { add(fi.files); fi.value = ""; };
  z.ondragover = e => { e.preventDefault(); z.classList.add("on"); };
  z.ondragleave = () => z.classList.remove("on");
  z.ondrop = e => { e.preventDefault(); z.classList.remove("on"); add(e.dataTransfer.files); };
});
function draw(z, k) {
  const fl = z.querySelector(".fl");
  fl.innerHTML = files[k].map((f, i) => `<span class="fc">${esc(f.name)}<button data-i="${i}" aria-label="Remove">×</button></span>`).join("");
  fl.querySelectorAll("button").forEach(b => b.onclick = () => { files[k].splice(+b.dataset.i, 1); draw(z, k); chk(); });
}

/* ---------- PAPER CORRECTION: OCR ---------- */
const jpg = c => c.toDataURL("image/jpeg", .92).split(",")[1];
async function toPages(f) {
  if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
    const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise, out = [];
    for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) {
      const pg = await pdf.getPage(i), vp = pg.getViewport({scale: 2.2}), c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height;
      await pg.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
      const tc = await pg.getTextContent();
      out.push({img: jpg(c), hint: tc.items.map(x => x.str).join(" ").trim()});
    }
    return out;
  }
  const bmp = await createImageBitmap(f), k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
  c.width = bmp.width * k; c.height = bmp.height * k;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
  return [{img: jpg(c), hint: ""}];
}
const OCR_SYS = "You are a meticulous OCR engine for exam papers, both handwritten and printed. Transcribe EVERY word, number, symbol, label and table on the page exactly as written, in reading order, keeping question numbers and line breaks. Do not fix spelling, grammar or maths, and do not answer or comment. Write crossed-out text as [crossed out: ...], unreadable text as [illegible], diagrams as [diagram: short description], and tables as rows separated by ' | '. Write maths in plain text (x^2, 3/4), never LaTeX. Output only the transcription.";
const ocr = (p, label) => llm({system: OCR_SYS, model: M().ocr, messages: [{role: "user", content: [{image: p.img},
  {text: `Transcribe this page (${label}).` + (p.hint.length > 30 ? `\nOptional reference, the embedded text layer (may be incomplete or out of order):\n${p.hint.slice(0, 6000)}` : "")}]}]});
async function pool(items, n, fn) {
  const r = []; let i = 0;
  await Promise.all(Array.from({length: Math.min(n, items.length)}, async () => { while (i < items.length) { const k = i++; r[k] = await fn(items[k]); } }));
  return r;
}

/* ---------- PAPER CORRECTION: marking ---------- */
const GRADE_SYS = `You are a strict, meticulous, impartial examiner. You receive a MARK SCHEME and the transcription of a student's answers (OCR, so minor transcription noise is possible). Mark every question.
Rules:
- Use ONLY the mark scheme. Award marks point by point exactly as it specifies, respecting "accept", "do not accept", alternative answers and error-carried-forward rules. Never award a mark the student's words do not earn, and never invent text the student did not write.
- If the mark scheme gives no marks for a question, infer them from brackets or the structure. Mark sub-parts separately (1a, 1b...). Include every question in the mark scheme, even unanswered ones (awarded 0).
- If the transcription is [illegible] where an answer should be, mark what is readable and say so in the issue.
- student_answer must quote the student's transcribed answer faithfully (or "No answer found").
- correct_answer is the full correct answer according to the mark scheme.
- points lists each mark scheme point with earned true/false.
- mistakes lists only real errors: issue = what went wrong, fix = how to get the mark. Empty array if full marks.
- Write plain text only: no LaTeX, no dollar signs, no markdown symbols. Maths as plain text (x^2, 3/4).
Return JSON only in exactly this shape:
{"overall_feedback":"2-3 sentence summary","questions":[{"id":"1a","question":"short question text","max_marks":2,"awarded":1,"student_answer":"","correct_answer":"","points":[{"text":"","earned":true}],"mistakes":[{"issue":"","fix":""}]}]}`;
const parse = s => JSON.parse(s.slice(s.indexOf("{"), s.lastIndexOf("}") + 1));
const status = (t, p) => { $("#prog").classList.add("on"); $("#pt").textContent = t; $("#pb").style.width = p + "%"; };

$("#run").onclick = async () => {
  const btn = $("#run"), err = $("#err"); btn.disabled = true; err.style.display = "none"; $("#res").innerHTML = "";
  try {
    const jobs = [];
    for (const k of ["a", "b", "m"]) for (const f of files[k]) {
      status("Preparing " + f.name, 3);
      (await toPages(f)).forEach((p, i) => jobs.push({k, p, l: `${f.name}, page ${i + 1}`}));
    }
    let d = 0;
    const out = await pool(jobs, 3, async j => {
      const t = await ocr(j.p, j.l); status(`Reading text ${++d} of ${jobs.length} pages`, 5 + d / jobs.length * 60);
      return {k: j.k, t: `[${j.l}]\n${t}`};
    });
    const T = {a: "", b: "", m: $("#msText").value.trim()};
    out.forEach(o => T[o.k] += (T[o.k] ? "\n\n" : "") + o.t);
    const ctx = `MARK SCHEME:\n${T.m}\n\nSTUDENT ANSWERS, PART 1:\n${T.a || "(none)"}\n\nSTUDENT ANSWERS, PART 2:\n${T.b || "(none)"}`;
    status("Marking against the mark scheme", 70);
    const draft = parse(await llm({system: GRADE_SYS, model: M().grade, json: true,
      messages: [{role: "user", content: ctx + "\n\nMark every question now. Return JSON only."}]}));
    status("Double-checking every mark", 88);
    let final = draft;
    try {
      final = parse(await llm({system: GRADE_SYS, model: M().grade, json: true, messages: [{role: "user", content:
        ctx + "\n\nDRAFT MARKING:\n" + JSON.stringify(draft) + "\n\nAudit this draft strictly. For each question re-check the student's answer against every mark scheme point, fix wrong marks, wrong quotes and missing questions, then return the corrected full JSON only."}]}));
      if (!Array.isArray(final.questions) || !final.questions.length) final = draft;
    } catch { final = draft; }
    if (!Array.isArray(final.questions) || !final.questions.length) throw new Error("No questions could be marked. Check the mark scheme and answer scans.");
    status("Done", 100); render(final, T);
  } catch (e) { err.textContent = e.message; err.style.display = "block"; $("#prog").classList.remove("on"); }
  btn.disabled = false; chk();
};

/* ---------- PAPER CORRECTION: results ---------- */
function render(r, T) {
  const qs = r.questions.map(q => {
    const max = Math.max(0, +q.max_marks || 0), aw = Math.min(max, Math.max(0, +q.awarded || 0));
    return {...q, max, aw, st: aw >= max ? "ok" : aw > 0 ? "mid" : "bad"};
  });
  const got = qs.reduce((s, q) => s + q.aw, 0), tot = qs.reduce((s, q) => s + q.max, 0), pct = tot ? Math.round(got / tot * 100) : 0;
  const n = x => +x.toFixed(2), cls = pct >= 70 ? "" : pct >= 45 ? "mid" : "bad";
  const verdict = pct >= 90 ? "Outstanding" : pct >= 75 ? "Strong result" : pct >= 60 ? "Good effort" : pct >= 40 ? "Getting there" : "Needs more work";
  const cnt = s => qs.filter(q => q.st === s).length;
  const wrong = qs.filter(q => (q.mistakes || []).length || q.aw < q.max);
  const C = 326.7;
  $("#res").innerHTML = `
  <div class="hero ${cls}">
    <div class="ringw"><svg class="ring" viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="arc" id="arc" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 60 60)"/></svg>
      <div class="pc"><b id="pnum">0</b><span>percent</span></div></div>
    <div class="hi"><div class="mk1">Your mark</div>
      <div class="big">${n(got)}<small> / ${n(tot)}</small></div>
      <div class="vd">${verdict}</div>
      <p>${inl(r.overall_feedback || "")}</p>
      <div class="st"><span>${cnt("ok")} full marks</span><span>${cnt("mid")} partial</span><span>${cnt("bad")} no marks</span></div></div>
  </div>
  <h3 class="sec">Mistakes made <em>${wrong.length}</em></h3>
  ${wrong.length ? wrong.map(q => `<div class="mk"><div class="mkh"><b>Question ${inl(q.id)}</b><span class="chip bad">−${n(q.max - q.aw)} mark${q.max - q.aw === 1 ? "" : "s"}</span></div>
    ${(q.mistakes || []).map(m => `<p><span class="lb">What went wrong</span>${inl(m.issue)}</p><p><span class="lb ok">How to fix it</span>${inl(m.fix)}</p>`).join("") || `<p class="mute">Marks were lost against the mark scheme.</p>`}</div>`).join("")
   : `<div class="good">No mistakes found. Every mark was earned.</div>`}
  <h3 class="sec">Right answers vs mark scheme</h3>
  ${qs.map(q => `<div class="qc"><div class="qh"><span class="qn">Q${inl(q.id)}</span><span class="qt">${inl(q.question || "")}</span><span class="chip ${q.st}">${n(q.aw)} / ${n(q.max)}</span></div>
    <div class="g3">
      <div><h4>Your answer</h4>${fmt(q.student_answer) || `<p class="mute">No answer found</p>`}</div>
      <div><h4>Mark scheme points</h4><ul class="pts">${(q.points || []).map(p => `<li class="${p.earned ? "ok" : "bad"}"><i>${p.earned ? "✓" : "✗"}</i><span>${inl(p.text)}</span></li>`).join("")}</ul></div>
      <div><h4>Correct answer</h4>${fmt(q.correct_answer)}</div>
    </div></div>`).join("")}
  <details><summary>Extracted text (check the OCR)</summary><pre>${esc("PART 1\n" + T.a + "\n\nPART 2\n" + T.b)}</pre></details>`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $("#arc").style.strokeDashoffset = C * (1 - pct / 100);
    const el = $("#pnum"), t0 = performance.now();
    (function tick(t) { const p = Math.min(1, (t - t0) / 1500); el.textContent = Math.round(pct * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); })(t0);
  }));
  $("#res").scrollIntoView({behavior: "smooth", block: "start"});
}
</script>
</body>
</html>
