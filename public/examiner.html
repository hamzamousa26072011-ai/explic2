<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAIE / Edexcel / OxfordAQA — Principal AI Examiner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .green-highlight {
      background-color: #dcfce7;
      border-left: 4px solid #16a34a;
      color: #14532d;
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 4px;
      font-weight: 500;
      display: block;
    }
    .red-highlight {
      background-color: #fee2e2;
      border-left: 4px solid #dc2626;
      color: #7f1d1d;
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 4px;
      font-weight: 500;
      display: block;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid #cbd5e1;
      padding: 0.6rem;
      text-align: left;
    }
    .markdown-body th {
      background-color: #f1f5f9;
      font-weight: 700;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      font-weight: 700;
      color: #0f172a;
    }
    .markdown-body h2 {
      font-size: 1.35rem;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.4rem;
    }
    .markdown-body blockquote {
      border-left: 4px solid #6366f1;
      background: #f8fafc;
      padding: 0.75rem 1rem;
      margin: 1rem 0;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <header class="bg-slate-900 text-white py-6 shadow-md">
    <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <div>
        <span class="text-xs uppercase tracking-widest bg-indigo-600 px-2.5 py-1 rounded font-semibold">
          Forensic OCR &amp; 3-Pass Moderation
        </span>
        <h1 class="text-2xl font-bold mt-2">
          AI Principal Examiner &amp; Assessment Moderator
        </h1>
        <p class="text-slate-400 text-sm">
          Cambridge (IGCSE / O-Level / AS &amp; A-Level) · Pearson Edexcel · OxfordAQA
        </p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <!-- Upload Form -->
    <form id="examinerForm" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
      <div class="grid md:grid-cols-2 gap-6">
        <!-- Student Script Upload -->
        <div class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center hover:border-indigo-500 transition">
          <label class="block cursor-pointer">
            <span class="text-sm font-semibold text-slate-700 block mb-1">
              1. Upload Past Paper / Student Script
            </span>
            <span class="text-xs text-slate-500 block mb-4">
              PDF or High-Res Images (JPG/PNG) — All pages
            </span>
            <input
              type="file"
              id="studentScript"
              name="studentScript"
              multiple
              accept=".pdf,image/*"
              required
              class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
            />
          </label>
        </div>

        <!-- Official Mark Scheme Upload -->
        <div class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center hover:border-indigo-500 transition">
          <label class="block cursor-pointer">
            <span class="text-sm font-semibold text-slate-700 block mb-1">
              2. Upload Official Mark Scheme
            </span>
            <span class="text-xs text-slate-500 block mb-4">
              PDF or High-Res Images (JPG/PNG) — Complete rubric
            </span>
            <input
              type="file"
              id="markScheme"
              name="markScheme"
              multiple
              accept=".pdf,image/*"
              required
              class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100"
            />
          </label>
        </div>
      </div>

      <div class="mt-6 flex items-center justify-between">
        <p id="statusText" class="text-sm text-slate-500">
          Ready to run 4-Stage Forensic Transcription &amp; 3-Pass Marking.
        </p>
        <button
          type="submit"
          id="submitBtn"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow transition disabled:opacity-50"
        >
          Run Full Examiner Audit
        </button>
      </div>
    </form>

    <!-- Live Output Container -->
    <div id="resultContainer" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-8">
      <div class="flex items-center justify-between border-b pb-4 mb-6">
        <h2 class="text-lg font-bold text-slate-800">Examiner Moderation Report</h2>
        <button
          id="copyBtn"
          class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded"
        >
          Copy Raw Report
        </button>
      </div>
      <div id="reportOutput" class="markdown-body text-slate-800 leading-relaxed text-sm"></div>
    </div>
  </main>

  <script>
    const SITE_KEY = "key_ps5gnQ9rlp4xSCl6";
    const form = document.getElementById("examinerForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusText = document.getElementById("statusText");
    const resultContainer = document.getElementById("resultContainer");
    const reportOutput = document.getElementById("reportOutput");
    const copyBtn = document.getElementById("copyBtn");

    let rawMarkdown = "";

    function formatHighlights(html) {
      return html
        .replace(
          /\[GREEN HIGHLIGHT \| ✓\](.*?)(\n|<br>|<\/p>|<\/li>)/g,
          '<span class="green-highlight">✓ $1</span>$2'
        )
        .replace(
          /\[RED HIGHLIGHT \| ✗\](.*?)(\n|<br>|<\/p>|<\/li>)/g,
          '<span class="red-highlight">✗ $1</span>$2'
        );
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      rawMarkdown = "";
      reportOutput.innerHTML = "";
      resultContainer.classList.remove("hidden");
      submitBtn.disabled = true;
      statusText.textContent = "Inspecting pages, running verbatim OCR, and moderating against Mark Scheme...";

      const formData = new FormData(form);

      try {
        const response = await fetch("/api/evaluate-script", {
          method: "POST",
          headers: {
            "x-site-key": SITE_KEY,
          },
          body: formData,
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || "Failed to process script");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n\n");

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const dataStr = line.replace("data: ", "").trim();
              if (dataStr === "[DONE]") {
                statusText.textContent = "Moderation Complete — 100% Verbatim Fidelity Lock.";
                break;
              }
              const parsed = JSON.parse(dataStr);
              if (parsed.error) throw new Error(parsed.error);
              if (parsed.text) {
                rawMarkdown += parsed.text;
                const rendered = marked.parse(rawMarkdown);
                reportOutput.innerHTML = formatHighlights(rendered);
              }
            }
          }
        }
      } catch (err) {
        statusText.textContent = "Error: " + err.message;
        reportOutput.innerHTML = `<div class="red-highlight">Error: ${err.message}</div>`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(rawMarkdown);
      copyBtn.textContent = "Copied!";
      setTimeout(() => (copyBtn.textContent = "Copy Raw Report"), 2000);
    });
  </script>
</body>
</html>
