<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Scholar — Principal Examiner & Script Moderator</title>
  <!-- Tailwind CSS for clean styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js to render Markdown tables and formatting cleanly -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Styling for the rendered Examiner Report & Ledger Tables */
    .examiner-output h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #e2e8f0;
    }
    .examiner-output h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #334155;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .examiner-output table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .examiner-output th, .examiner-output td {
      border: 1px solid #cbd5e1;
      padding: 0.65rem 0.85rem;
      text-align: left;
    }
    .examiner-output th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #0f172a;
    }
    .examiner-output tr:nth-child(even) {
      background-color: #f8fafc;
    }
    .examiner-output ul, .examiner-output ol {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
      list-style-type: disc;
    }
    .examiner-output p {
      margin-bottom: 0.75rem;
      line-height: 1.65;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen py-8 px-4">

  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="bg-slate-900 text-white rounded-2xl p-6 mb-6 shadow-lg flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <span class="inline-block bg-amber-500/20 text-amber-300 text-xs font-semibold px-2.5 py-1 rounded-full mb-2 border border-amber-400/30">
          CAIE · Pearson Edexcel · OxfordAQA
        </span>
        <h1 class="text-2xl font-bold tracking-tight">AI Scholar — Principal Examiner</h1>
        <p class="text-slate-300 text-sm mt-1">Forensic Script Transcription & 3-Pass Board-Level Assessment Moderator</p>
      </div>
      <div class="flex items-center gap-2">
        <select id="providerSelect" class="bg-slate-800 text-slate-200 text-xs rounded-lg px-3 py-2 border border-slate-700 focus:outline-none">
          <option value="gemini" selected>Provider: Gemini Principal Examiner (Fast &amp; Accurate)</option>
          <option value="deepseek">Provider: DeepSeek API</option>
          <option value="openai">Provider: OpenAI API (gpt-4o)</option>
        </select>
      </div>
    </div>

    <!-- Input Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Exam Board & Subject</label>
          <input id="examMeta" type="text" placeholder="e.g., CAIE IGCSE Physics (0625) Paper 42" 
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Session / Series</label>
          <input id="examSession" type="text" placeholder="e.g., May/June 2026 Variant 2" 
            class="w-full rounded-lg border border-slate-300 px-3.5 py-2 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Upload Script Images (Optional — Vision Models)</label>
          <input id="scriptImages" type="file" accept="image/*,.pdf" multiple 
            class="w-full text-xs text-slate-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-800 hover:file:bg-slate-200" />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">
            1. Question Paper (QP) & Official Mark Scheme (MS)
          </label>
          <textarea id="msInput" rows="7" placeholder="Paste the official Question stems, maximum marks [N], and official Mark Scheme (M1, A1, B1, C1 criteria, Accept/Reject rules)..."
            class="w-full rounded-xl border border-slate-300 p-3.5 text-sm font-mono focus:ring-2 focus:ring-slate-900 focus:outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">
            2. Student Script / Answers to Examine
          </label>
          <textarea id="studentInput" rows="7" placeholder="Paste the student's written responses, calculations, units, and rough working here (or upload script images above if using a vision model)..."
            class="w-full rounded-xl border border-slate-300 p-3.5 text-sm font-mono focus:ring-2 focus:ring-slate-900 focus:outline-none"></textarea>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-4 pt-2 border-t border-slate-100">
        <p id="statusText" class="text-xs text-slate-500">Ready for 4-Stage Forensic Moderation.</p>
        <button id="gradeBtn" onclick="runExaminerModeration()" 
          class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition flex items-center gap-2 shadow-sm disabled:opacity-50 cursor-pointer">
          <span>Run 3-Pass Examiner Moderation</span>
        </button>
      </div>
    </div>

    <!-- Output Area -->
    <div id="resultContainer" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="flex items-center justify-between border-b border-slate-200 pb-4 mb-4">
        <h2 class="text-lg font-bold text-slate-900">Official Examiner Moderation Report</h2>
        <button onclick="copyReportText()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-800 font-medium px-3 py-1.5 rounded-lg transition cursor-pointer">
          Copy Full Report
        </button>
      </div>
      <div id="examinerOutput" class="examiner-output text-slate-800 text-sm leading-relaxed"></div>
    </div>
  </div>

  <script>
    // ============================================================================
    // CONFIGURATION & SYSTEM PROMPT
    // ============================================================================
    const API_KEY = "";

    const SYSTEM_PROMPT = `# ROLE & PROFESSIONAL AUTHORITY
You are an elite Principal Examiner, Chief Assessment Moderator, and Forensic Handwriting Transcription Specialist for international examination boards, specifically:
- Cambridge Assessment International Education (CAIE: IGCSE, O-Level, AS & A-Level)
- Pearson Edexcel (International GCSE & International A-Level)
- OxfordAQA International Examinations

Your mandate is to examine a student's completed past paper or script strictly against the official Question Paper (QP) and Mark Scheme (MS). You must maintain 100% fidelity, zero omissions, and rigorous board-level marking accuracy. You never assume student intent, never award unearned credit, and consistently verify consequential error (Error Carried Forward / ECF).

---

# CORE DIRECTIVES & FORMATTING DISCIPLINE
1. Zero Omission Policy: You must account for every single question and sub-question from Page 1 to the end of the script. Do not summarize or skip unattempted or zero-mark questions.
2. Clean Mathematical & Scientific Notation: NEVER use raw LaTeX syntax or dollar-sign enclosures ($ or $$). Write all formulas, units, and values in clean, readable text (e.g., "E = W / Q", "Δθ = 14.5 °C", "ρ = 2.70 g/cm³").
3. Decisive Ticks (✓) and Crosses (✗): Every mark allocated or withheld must be tied to a distinct marking point (e.g., M1, A1, B1, C1, or Level/Band criteria).
4. Error Carried Forward (ECF): If a calculation error occurs in an earlier part (e.g., 2(a)), verify whether subsequent parts (2(b), 2(c)) use that incorrect value correctly. Award full method/working marks where permitted by board conventions.

---

# 4-STAGE MODERATION WORKFLOW

### STAGE 1 — FORENSIC OCR & SCRIPT TRANSCRIPTION
Go through every page of the student script and transcribe:
- Complete question numbering and sub-question identifiers (e.g., 1(a), 1(b)(i), 2(c)).
- Printed question stems and maximum available marks [N].
- 100% verbatim student handwriting, including crossed-out work, numerical working, formula substitutions, units, significant figures, and final answers.
- All margin notes, rough sketches, graph readings, and annotations written anywhere on the paper.

### STAGE 2 — EXHAUSTIVE MARK SCHEME EXTRACTION
From the official mark scheme, extract:
- Every marking point code (M = Method, A = Accuracy, B = Independent, C = Compensatory) or Level-of-Response criteria.
- Mandatory keywords and underlined terminology (owtte = "or words to that effect").
- Accept / Allow guidance, numerical tolerance ranges, and valid equivalent methods.
- Reject / Do Not Accept / Ignore directives, unit penalties, and rounding rules.

### STAGE 3 — 3-PASS INDEPENDENT MARKING
- Pass 1 (Strict Mark Scheme Matching): Match the student's transcribed text and working against individual rubric points. Apply standard board penalties if a mandatory keyword or unit is omitted.
- Pass 2 (Technical & Consequential Verification): Audit mathematical steps, significant figures (standard 2–3 s.f. unless specified), and verify ECF across linked calculation sub-questions.
- Pass 3 (Senior Moderator Lock): Reconcile any discrepancies against board marking conventions (e.g., list rules, contradictions, benefit of the doubt limits) and lock the question-level score.

---

# REQUIRED DELIVERABLE STRUCTURE

Output your complete evaluation using the four sections below:

## 1. Executive Summary & Mark Ledger
- Header: Examination Board | Subject & Code | Paper Component | Session
- Score Summary: Total Awarded / Maximum Available (Percentage %) | Provisional Grade (e.g., A*, A, B, 9–1)
- Ledger Table:
  | Question | Topic / Focus | Student Evidence | Mark Scheme Criteria | Score |
  |---|---|---|---|---|
  | Q1(a) | [Topic] | [Quote student text/working] | [Marking codes & rules] | [X / Y] |

## 2. Question-by-Question Deep Dive & Line-by-Line Corrections
For EVERY question and sub-question:
1. Question Header: Question N(x) · [Topic] · [Awarded / Max Marks]
2. Student Transcription: Exact transcribed answer and annotations.
3. What Earned You Ticks (✓):
   - Bullet points citing the specific phrases, steps, or values that secured each mark (M1, A1, B1).
4. Corrections Marked with a Red Cross (✗) & Why Marks Were Lost:
   For every deducted mark:
   - ✗ Student Error / Omission: "[Quote the exact student mistake or missing element]"
   - Why It Lost Marks: Detailed explanation citing the exact mark scheme requirement or Reject rule.
   - » Direct Model Correction: The exact phrase, calculation, or step needed to secure full credit.
   - Examiner Full-Mark Tip: Advice on exam technique, command words, or avoiding common traps.
5. Examiner Comment: Concise moderator takeaway for that question.

## 3. Whole-Script Diagnostic & Action Plan
- Strengths to Protect (✓): 3–4 specific techniques or topic areas executed well.
- Where Marks Were Lost (✗): Categorized loss breakdown (e.g., missing keywords, unit errors, sig-fig truncation, incomplete working, misread command words).
- Next Four Concrete Exam Targets: 4 high-yield, actionable revisions for the student's next practice paper.
- Projected Score with Fixes Applied: Recalculated total and grade if these specific targets are met.

## 4. Concise Summary (WhatsApp Format)
A clean, scannable briefing designed for quick messaging to a student or parent:
- Subject & Paper: [Board] [Subject] [Paper]
- Result: [Score] / [Max] ([Percentage]%) — Grade [Provisional Grade]
- Key Strengths: [Top 2 strengths]
- Priority Improvement Areas: [Top 2 areas]
- Next Steps: [Immediate revision action]`;

    let rawMarkdownReport = "";

    async function runExaminerModeration() {
      const examMeta = document.getElementById("examMeta").value.trim() || "CAIE IGCSE / A-Level";
      const examSession = document.getElementById("examSession").value.trim() || "2026";
      const msInput = document.getElementById("msInput").value.trim();
      const studentInput = document.getElementById("studentInput").value.trim();
      const imageFiles = document.getElementById("scriptImages").files;
      const provider = document.getElementById("providerSelect").value;

      if (!msInput && !studentInput && imageFiles.length === 0) {
        alert("Please provide the Question Paper/Mark Scheme and the Student Script before running moderation.");
        return;
      }

      const gradeBtn = document.getElementById("gradeBtn");
      const statusText = document.getElementById("statusText");
      const resultContainer = document.getElementById("resultContainer");
      const examinerOutput = document.getElementById("examinerOutput");

      gradeBtn.disabled = true;
      statusText.textContent = "Executing 4-Stage Forensic Moderation (Streaming live)...";
      resultContainer.classList.remove("hidden");
      examinerOutput.innerHTML = "<p class='text-slate-400 animate-pulse'>Initializing Principal Examiner protocol...</p>";
      rawMarkdownReport = "";

      try {
        // Send to backend /api/examiner which supports DeepSeek API, OpenAI, and Gemini
        const response = await fetch("/api/examiner", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            examMeta,
            examSession,
            msInput,
            studentInput,
            systemPrompt: SYSTEM_PROMPT,
            provider,
            stream: true
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`API Error (${response.status}): ${errText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith("data: ")) continue;
            const dataStr = trimmed.replace("data: ", "");
            if (dataStr === "[DONE]") break;

            try {
              const parsed = JSON.parse(dataStr);
              const delta = parsed.choices?.[0]?.delta?.content || parsed.text;
              if (delta) {
                rawMarkdownReport += delta;
                examinerOutput.innerHTML = marked.parse(rawMarkdownReport);
              }
            } catch (e) {
              // Ignore partial JSON chunks during stream
            }
          }
        }

        statusText.textContent = "Moderation Complete — Locked by Senior Moderator.";
      } catch (error) {
        console.error(error);
        examinerOutput.innerHTML = `<div class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm">
          <strong>Moderation Error:</strong> ${error.message}
        </div>`;
        statusText.textContent = "Error encountered during moderation.";
      } finally {
        gradeBtn.disabled = false;
      }
    }

    function copyReportText() {
      if (!rawMarkdownReport) return;
      navigator.clipboard.writeText(rawMarkdownReport);
      alert("Full Examiner Report copied to clipboard!");
    }
  </script>
</body>
</html>
